<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Header</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

  <!-- Top Navbar -->
  <div class="navbar">

    <div class="logo">
      <img src="amazon-logo.png" alt="Amazon">
    </div>

    <div class="location">
      <small>Delivered to</small>
      <span>Ethiopia</span>
    </div>

    <div class="search-box">
      <select>
        <option>All</option>
      </select>

      <input type="text" placeholder="Search Product">

      <button>
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="language">
        <img src="https://www.britannica.com/topic/flag-of-the-United-States-of-America" alt="usa" width="20px"/>
       EN
    </div>

    <div class="account">
      <small>Sign in</small>
      <span>Account & Lists</span>
    </div>

    <div class="orders">
      <small>Returns</small>
      <span>& Orders</span>
    </div>

  </div>

  <!-- Bottom Navbar -->
  <div class="menu-bar">

    <a href="#"><i class="fa-solid fa-bars"></i> All</a>
    <a href="#">Today's Deals</a>
    <a href="#">Customer Service</a>
    <a href="#">Registry</a>
    <a href="#">Gift Cards</a>
    <a href="#">Sell</a>

  </div>

</header>
<div class="carousel">
  <div class="slides">
    <img src="https://m.media-amazon.com/images/I/71ROLBmB4AL._SX3000_.jpg" alt="Slide 1">
    <img src="https://m.media-amazon.com/images/I/619geyiQI5L._SX3000_.jpg" alt="Slide 2">
    <img src="https://m.media-amazon.com/images/I/61Yx5-N155L._SX3000_.jpg" alt="Slide 3">
    <img src="https://m.media-amazon.com/images/I/71qcoYgEhzL._SX3000_.jpg" alt="Slide 4">
  </div>
</div>

</body>
</html>
